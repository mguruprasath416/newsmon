version: '3.8'

services:
  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: clarityti_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: clarityti
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: clarityti_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Elasticsearch ──────────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.16.1
    container_name: clarityti_es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - cluster.name=clarityti
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── FastAPI Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clarityti_api
    restart: unless-stopped
    env_file: .env
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/clarityti
      - REDIS_URL=redis://redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    # NOTE: Remove the bind-mount volume below in production so the built
    # image code is used. Keep it only for local hot-reload development.
    # volumes:
    #   - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Celery Worker ─────────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clarityti_worker
    restart: unless-stopped
    env_file: .env
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/clarityti
      - REDIS_URL=redis://redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - PYTHONPATH=/app
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    # NOTE: Remove the bind-mount volume below in production.
    # volumes:
    #   - ./backend:/app
    command: celery -A workers.celery_app worker --loglevel=info -Q default,lens,digest,collection -P solo

  # ── Celery Beat (Scheduler) ──────────────────────────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clarityti_beat
    restart: unless-stopped
    env_file: .env
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/clarityti
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    volumes:
      # Persist the celerybeat schedule file so tasks aren't re-sent on restart
      - celerybeat_schedule:/app/celerybeat-schedule
    command: celery -A workers.celery_app beat --loglevel=info --schedule=/app/celerybeat-schedule/celerybeat-schedule

  # ── Next.js Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clarityti_ui
    restart: unless-stopped
    environment:
      # These are browser-side env vars — localhost is correct for the end-user's browser
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  # ── Flower (Celery Monitor) ───────────────────────────────────────────────────
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clarityti_flower
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    command: celery -A workers.celery_app flower --port=5555

volumes:
  mongo_data:
  redis_data:
  es_data:
  celerybeat_schedule:

networks:
  default:
    name: clarityti_net
